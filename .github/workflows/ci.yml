# Plantify CI Pipeline
#
# Continuous Integration für Backend + Frontend. Läuft bei push und
# pull_request auf main. Kein automatisches Deployment.
#
# Hinweis zur Test-Exclusion:
#   PlantifymeApplicationTests ist die einzige @SpringBootTest-Klasse ohne
#   @ActiveProfiles("test") und lädt damit das Default-Spring-Profile mit
#   der echten MongoDB-Atlas-URI aus application.properties. Atlas hat eine
#   IP-Allowlist, GitHub-Actions-Runner-IPs sind nicht freigegeben → der
#   Test würde in CI scheitern. Wir excluden ihn deshalb hier explizit per
#   CLI-Argument; lokal läuft er weiter normal mit ./mvnw verify.
#
# Off-by-default-Tests (12 Klassen mit @EnabledIfEnvironmentVariable wie
# RUN_COVERAGE, RUN_AI_COMPARISON, RUN_IMPACT_VALIDATION, RUN_FIX*, RUN_PROBE)
# werden automatisch übersprungen, weil die entsprechenden ENV-Vars hier
# nicht gesetzt sind. Keine zusätzliche Konfiguration nötig.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests + JaCoCo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Run Maven verify (Tests + JaCoCo)
        # PlantifymeApplicationTests excluded — siehe Hinweis am Datei-Anfang.
        # failIfNoTests=false als defensive Massnahme falls der Filter
        # unerwartet auf 0 Tests trifft.
        run: ./mvnw verify -B -Dtest='!PlantifymeApplicationTests' -DfailIfNoTests=false

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Upload Surefire Reports (bei Test-Failure hilfreich)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

  frontend:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm run test:unit
